version: "3.8"

services:
  router:
    image: python:3.10-alpine
    container_name: router
    volumes:
      - ./requirements.txt:/requirements.txt
    command: sh -c "pip install -r /requirements.txt"
    networks:
      my_lan:
        ipv4_address: "182.20.1.5"

  auth_server:
    image: python:3.10-alpine
    container_name: auth_server
    user: root
    environment:
      DATABASE_URL: sqlite:///projectdb1.db
    volumes:
      - ./auth:/auth
      - ./dal:/dal
      - ./common:/common
      - ./projectdb1.db:/projectdb1.db
      - ./requirements.txt:/requirements.txt
    command: sh -c "pip install -r /requirements.txt && python /auth/server.py"
    networks:
      my_lan:
        ipv4_address: "182.20.1.3"
    ports:
      - "5000:5000"
    

  db_server:
    image: python:3.10-alpine
    container_name: db_server
    user: root
    environment:
      DATABASE_URL: sqlite:///projectdb1.db
    volumes:
      - ./dal:/dal
      - ./common:/common
      - ./requirements.txt:/requirements.txt
      - ./projectdb1.db:/projectdb1.db
    command: sh -c "pip install -r /requirements.txt && python /dal/server.py"
    networks:
      my_lan:
        ipv4_address: "182.20.1.4"
    ports:
      - "5001:5001"
  
  gateway_server:
    image: python:3.10-alpine
    container_name: gateway_server
    user: root
    volumes:
      - ./gateway:/gateway
      - ./dal:/dal
      - ./common:/common
      - ./requirements.txt:/requirements.txt
    command: sh -c "pip install -r /requirements.txt && python /gateway/server.py"
    networks:
      my_lan:
        ipv4_address: "182.20.1.2"
    ports:
      - "5002:5002"

  client_auth:
    image: python:3.10-alpine
    container_name: client_auth
    user: root
    volumes:
      - ./auth:/auth
      - ./requirements.txt:/requirements.txt
    command: sh -c "pip install -r /requirements.txt && python /auth/test.py"
    networks:
      my_lan:
        ipv4_address: "182.20.1.6"
    
networks:
  my_lan:
    driver: bridge
    ipam:
      config:
        - subnet: 182.20.0.0/16