version: "3.8"

services:
  auth_server:
    image: python:3.10-alpine
    container_name: auth_server
    user: root
    environment:
      DATABASE_URL: sqlite:///projectdb2.db
    volumes:
      - ./auth:/auth
      - ./dal:/dal
      - ./common:/common
      - ./projectdb2.db:/projectdb2.db
      - ./requirements.txt:/requirements.txt
    command: sh -c "pip install -r /requirements.txt && python /auth/server.py"
    networks:
      my_lan:
        ipv4_address: "182.20.1.3"
    ports:
      - "5000:5000"
    

  db_server:
    image: python:3.10-alpine
    container_name: db_server
    user: root
    environment:
      DATABASE_URL: sqlite:///projectdb2.db
    volumes:
      - ./dal:/dal
      - ./common:/common
      - ./requirements.txt:/requirements.txt
      - ./projectdb2.db:/projectdb2.db
    command: sh -c "pip install -r /requirements.txt && python /dal/server.py"
    networks:
      my_lan:
        ipv4_address: "182.20.1.4"
    ports:
      - "5001:5001"
  
  gateway_server:
    image: python:3.10-alpine
    container_name: gateway_server
    user: root
    volumes:
      - ./gateway:/gateway
      - ./dal:/dal
      - ./common:/common
      - ./requirements.txt:/requirements.txt
    command: sh -c "pip install -r /requirements.txt && python /gateway/server.py"
    networks:
      my_lan:
        ipv4_address: "182.20.1.2"
    ports:
      - "5002:5002"

  
  frontend:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./frontend-js:/app
      - ./frontend-js/package.json:/app/package.json
      - ./frontend-js/package-lock.json:/app/package-lock.json
      - ./node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: >
      sh -c "npm uninstall date-fns &&
            npm install date-fns@3.0.0 &&
            npm install &&
            npm run dev -- --host"
    depends_on:
      - gateway_server
    restart: unless-stopped
    networks:
      my_lan:
        ipv4_address: "182.20.1.6"
    
networks:
  my_lan:
    driver: bridge
    ipam:
      config:
        - subnet: 182.20.0.0/16