version: "3.8"

services:
  router:
    image: python:3.10-alpine
    container_name: router
    volumes:
      - ./requirements.txt:/requirements.txt
    command: sh -c "pip install -r /requirements.txt"
    networks:
      my_lan:
        ipv4_address: "182.20.1.5"

  auth_server:
    image: python:3.10-alpine
    container_name: auth_server
    user: root
    volumes:
      - ./auth:/auth
      - ./dal:/dal
      - ./common:/common
      - sqlite_data:/projectdb1.db
      - ./requirements.txt:/requirements.txt
    command: sh -c "pip install -r /requirements.txt && python /auth/server.py"
    networks:
      my_lan:
        ipv4_address: "182.20.1.3"
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: sqlite:///projectdb1.db

  db_server:
    image: python:3.10-alpine
    container_name: db_server
    user: root
    volumes:
      - ./dal:/dal
      - ./common:/common
      - ./requirements.txt:/requirements.txt
      - sqlite_data:/projectdb1.db
    command: sh -c "pip install -r /requirements.txt && python /dal/server.py"
    networks:
      my_lan:
        ipv4_address: "182.20.1.4"
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: sqlite:///projectdb1.db

  client_auth:
    image: python:3.10-alpine
    container_name: client_auth
    user: root
    volumes:
      - ./auth:/auth
      - ./requirements.txt:/requirements.txt
    command: sh -c "pip install -r /requirements.txt && python /auth/test.py"
    networks:
      my_lan:
        ipv4_address: "182.20.1.9"
  
  client_db:
    image: python:3.10-alpine
    container_name: client_db
    user: root
    volumes:
      - ./dal:/dal
      - ./common:/common
      - ./requirements.txt:/requirements.txt
    command: sh -c "pip install -r /requirements.txt && python /dal/insert_data.py"
    networks:
      my_lan:
        ipv4_address: "182.20.1.8"

  

networks:
  my_lan:
    driver: bridge
    ipam:
      config:
        - subnet: 182.20.0.0/16