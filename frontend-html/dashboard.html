<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SecurePass</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="app-container bg-gradient-light">
        <header id="navbar-container"></header>
        
        <main class="container">
            <div class="page-header">
                <h1 class="page-title">Private Passwords</h1>
                <div class="page-actions">
                    <div class="search-container">
                        <svg xmlns="http://www.w3.org/2000/svg" class="search-icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                            <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                            <path d="M21 21l-6 -6" />
                        </svg>
                        <input type="text" id="search-passwords" placeholder="Search passwords..." class="search-input">
                    </div>
                    <button id="refresh-btn" class="btn btn-outline">
                        <svg xmlns="http://www.w3.org/2000/svg" class="btn-icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                            <path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" />
                            <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" />
                        </svg>
                        Refresh
                    </button>
                    <button id="add-password-btn" class="btn btn-primary btn-gradient-pink">
                        <svg xmlns="http://www.w3.org/2000/svg" class="btn-icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                            <path d="M12 5l0 14" />
                            <path d="M5 12l14 0" />
                        </svg>
                        Add Password
                    </button>
                </div>
            </div>

            <div id="passwords-container" class="cards-grid">
                <!-- Passwords will be loaded here -->
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Password Modal -->
    <div id="add-password-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Password</h2>
                <p>Enter the details for your new password.</p>
            </div>
            <div class="modal-body">
                <form id="add-password-form">
                    <div class="form-group">
                        <label for="new-password-name">Name</label>
                        <input type="text" id="new-password-name" placeholder="e.g., Gmail, Facebook" required>
                    </div>
                    <div class="form-group">
                        <label for="new-password-value">Password</label>
                        <input type="password" id="new-password-value" placeholder="Enter password" required>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="new-password-shared">
                        <label for="new-password-shared">Shared password</label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button id="cancel-add-password" class="btn btn-outline">Cancel</button>
                <button id="save-password" class="btn btn-primary">Save Password</button>
            </div>
        </div>
    </div>

    <!-- Edit Password Modal -->
    <div id="edit-password-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Password</h2>
                <p>Update your password details.</p>
            </div>
            <div class="modal-body">
                <form id="edit-password-form">
                    <input type="hidden" id="edit-password-id">
                    <div class="form-group">
                        <label for="edit-password-name">Name</label>
                        <input type="text" id="edit-password-name" placeholder="e.g., Gmail, Facebook" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-password-value">Password</label>
                        <input type="text" id="edit-password-value" placeholder="Enter password" required>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="edit-password-shared">
                        <label for="edit-password-shared">Shared password</label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button id="cancel-edit-password" class="btn btn-outline">Cancel</button>
                <button id="update-password" class="btn btn-primary">Update Password</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden">
        <div class="toast-content">
            <span id="toast-message"></span>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
