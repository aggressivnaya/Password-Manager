<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - SecurePass</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="app-container bg-gradient-light">
        <header id="navbar-container"></header>
        
        <main class="container">
            <div class="page-header">
                <h1 class="page-title">History</h1>
                <div class="page-actions">
                    <div class="search-container">
                        <svg xmlns="http://www.w3.org/2000/svg" class="search-icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                            <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                            <path d="M21 21l-6 -6" />
                        </svg>
                        <input type="text" id="search-history" placeholder="Search history..." class="search-input">
                    </div>
                    <button id="refresh-btn" class="btn btn-outline">
                        <svg xmlns="http://www.w3.org/2000/svg" class="btn-icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                            <path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" />
                            <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" />
                        </svg>
                        Refresh
                    </button>
                </div>
            </div>
            <h2 class="page-title">History of Password</h2>
            <div id="history-container" class="history-list">
                <!-- History items will be loaded here -->
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                </div>
            </div>


            <h2 class="page-title">History of Notification</h2>
            <div id="history-noti-container" class="history-list">
                <!-- History items will be loaded here -->
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                </div>
            </div>
        </main>

    <div id="toast" class="toast hidden">
        <div class="toast-content">
            <span id="toast-message"></span>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/history.js"></script>
</body>
</html>
